<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex">
<title>Matcha</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Public+Sans:wght@400;500&family=Geist+Mono:wght@400&display=swap">
<style>
/* Standalone hero, framed by the home page. Tokens mirror the site so the feathered edge melts into the page. */
:root {
  --bg: #fafafa; --ink: #141414; --ink-2: #6b6b6b; --ink-3: #a3a3a3;
  --ease-out: cubic-bezier(.23, 1, .32, 1);
  --f-sans: "Public Sans", "Helvetica Neue", Arial, sans-serif;
  --f-mono: "Geist Mono", ui-monospace, Menlo, monospace;
  color-scheme: light;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) { --bg: #0f0f0f; --ink: #f2f2f2; --ink-2: #9a9a9a; --ink-3: #5c5c5c; color-scheme: dark; }
}
:root[data-theme="dark"] { --bg: #0f0f0f; --ink: #f2f2f2; --ink-2: #9a9a9a; --ink-3: #5c5c5c; color-scheme: dark; }
* { box-sizing: border-box; }
html, body { margin: 0; height: 100%; overflow: hidden; background: var(--bg); }
body { font-family: var(--f-sans); -webkit-font-smoothing: antialiased; }
#hero { position: relative; width: 100%; height: 100%; }
@media (prefers-reduced-motion: reduce) {
  *, *::before, *::after { animation-duration: 1ms !important; animation-delay: 0ms !important; transition-duration: 1ms !important; }
}

#hero { overflow: hidden; opacity: 0; transition: opacity 700ms ease; touch-action: pan-y; user-select: none; -webkit-user-select: none; -webkit-tap-highlight-color: transparent; -webkit-mask-repeat: no-repeat; mask-repeat: no-repeat; -webkit-mask-size: 100% 100%; mask-size: 100% 100%; }
#hero.ready { opacity: 1; }
#hero canvas { position: absolute; display: block; pointer-events: none; }
#hero .mt-bg, #hero .mt-fx { left: 0; top: 0; width: 100%; height: 100%; }
#hero .mt-bowl { position: absolute; border-radius: 50%; touch-action: none; cursor: pointer; }
/* on phones a vertical swipe must still scroll the page; taps whisk and sideways drags stir */
@media (pointer: coarse) { #hero .mt-bowl { touch-action: pan-y; } }
#hero .mt-bowl.drag { cursor: grabbing; }
#hero .mt-vig { position: absolute; inset: 0; pointer-events: none; opacity: 0; background: radial-gradient(ellipse 72% 70% at 50% 50%, rgba(15,15,15,.1) 45%, rgba(15,15,15,.62) 100%); }
@media (prefers-color-scheme: dark) { :root:not([data-theme="light"]) #hero .mt-vig { opacity: 1; } }
:root[data-theme="dark"] #hero .mt-vig { opacity: 1; }
</style>
</head>
<body>
<div id="hero" role="img" aria-label="A bowl of whisked matcha on linen beside a bamboo whisk and scoop, seen from above. Tap the tea to whisk it, drag to stir.">
    <!-- ===== HERO MARKUP (variant-specific) ===== -->
    <canvas class="mt-bg" aria-hidden="true"></canvas>
    <canvas class="mt-tea" aria-hidden="true"></canvas>
    <canvas class="mt-steam" aria-hidden="true"></canvas>
    <canvas class="mt-fx" aria-hidden="true"></canvas>
    <div class="mt-vig" aria-hidden="true"></div>
    <div class="mt-bowl" aria-hidden="true"></div>
</div>
<script>
// the parent page passes its theme so a forced light/dark choice reaches the frame
try { const t = new URLSearchParams(location.search).get("theme"); if (t === "light" || t === "dark") document.documentElement.dataset.theme = t; } catch (e) {}
</script>
<script>
(() => {
  "use strict";
  const hero = document.getElementById("hero");
  if (!hero) return;
  const cBg = hero.querySelector(".mt-bg"), cTea = hero.querySelector(".mt-tea"), cSteam = hero.querySelector(".mt-steam"), cFx = hero.querySelector(".mt-fx"), bowlEl = hero.querySelector(".mt-bowl");
  const fx = cFx.getContext("2d");
  const mq = matchMedia("(prefers-reduced-motion: reduce)");
  let RM = mq.matches;
  const TAU = Math.PI * 2;

  /* ---------- small math + noise ---------- */
  const clamp = (v, a, b) => v < a ? a : v > b ? b : v;
  const mix = (a, b, t) => a + (b - a) * t;
  const sstep = (a, b, v) => { const t = clamp((v - a) / (b - a), 0, 1); return t * t * (3 - 2 * t); };
  const rng = (seed) => () => { seed = seed + 0x6D2B79F5 | 0; let t = Math.imul(seed ^ seed >>> 15, 1 | seed); t = t + Math.imul(t ^ t >>> 7, 61 | t) ^ t; return ((t ^ t >>> 14) >>> 0) / 4294967296; };
  const R0 = rng(7);
  const PERM = new Uint8Array(256), VAL = new Float32Array(256);
  for (let i = 0; i < 256; i++) { PERM[i] = i; VAL[i] = R0(); }
  for (let i = 255; i > 0; i--) { const j = (R0() * (i + 1)) | 0, t = PERM[i]; PERM[i] = PERM[j]; PERM[j] = t; }
  const h2 = (i, j) => VAL[PERM[(PERM[i & 255] + j) & 255]];
  const vn = (x, y) => {
    const xi = Math.floor(x), yi = Math.floor(y), xf = x - xi, yf = y - yi;
    const u = xf * xf * (3 - 2 * xf), v = yf * yf * (3 - 2 * yf);
    const a = h2(xi, yi), b = h2(xi + 1, yi), c = h2(xi, yi + 1), d = h2(xi + 1, yi + 1);
    return a + (b - a) * u + (c - a) * v + (a - b - c + d) * u * v;
  };
  const fbm = (x, y, o) => { let s = 0, a = .5, n = 0; for (let i = 0; i < o; i++) { s += a * vn(x, y); n += a; a *= .5; x = x * 2.03 + 17.3; y = y * 2.03 + 5.1; } return s / n; };
  const ih = (x, y) => { let h = (Math.imul(x, 374761393) + Math.imul(y, 668265263)) | 0; h = Math.imul(h ^ (h >>> 13), 1274126177); return ((h ^ (h >>> 16)) >>> 0) / 4294967296; };

  /* light: from the window, upper left, ~45deg up */
  const LV = (() => { const x = -.56, y = -.47, z = .68, l = Math.hypot(x, y, z); return [x / l, y / l, z / l]; })();
  const L2 = (() => { const l = Math.hypot(LV[0], LV[1]); return [LV[0] / l, LV[1] / l]; })();

  let W = 0, H = 0, dpr = 1, G = null, WS = null, CLOUD = null;

  function layout() {
    const u = H;
    G = { u, cx: .6 * u, cy: .5 * u, Ro: .355 * u };
    G.Ri = G.Ro - .03 * u; G.Rs = G.Ri * 1.03; G.Rl = G.Ri * .85;
    G.sh = .6; G.rimRl = G.Ri / G.Rl;
    G.Lw = .5 * u; G.headR = .108 * u;
    G.rest = { x: .99 * u, y: .82 * u, ang: -.17 };
    G.cs0 = [1.1 * u, .33 * u]; G.cs1 = [1.66 * u, .1 * u];
    // uneven rim, as a lookup by angle
    const NL = 1024; G.NL = NL; G.RO = new Float32Array(NL); G.RI = new Float32Array(NL);
    let roMax = 0;
    for (let i = 0; i < NL; i++) {
      const a = i / NL * TAU, ca = Math.cos(a), sa = Math.sin(a);
      const ro = G.Ro * (1 + .016 * (vn(ca * 1.6 + 11, sa * 1.6 + 4) - .5) * 2 + .006 * (vn(ca * 6 + 3, sa * 6 + 9) - .5) * 2);
      const th = .03 * u * (1 + .5 * (vn(ca * 2.4 + 21, sa * 2.4 + 2) - .5) * 2);
      G.RO[i] = ro; G.RI[i] = ro - th; roMax = Math.max(roMax, ro);
    }
    G.roMax = roMax;
  }

  /* ---------- static scene: linen, light, bowl, scoop, powder ---------- */
  function sdUCap(px, py, ax, ay, bx, by, r1, r2) {
    const dx = bx - ax, dy = by - ay, h = Math.hypot(dx, dy), ux = dx / h, uy = dy / h;
    const qx = Math.abs((px - ax) * uy - (py - ay) * ux), qy = (px - ax) * ux + (py - ay) * uy;
    const b = (r1 - r2) / h, a = Math.sqrt(1 - b * b), k = -b * qx + a * qy;
    if (k < 0) return Math.hypot(qx, qy) - r1;
    if (k > a * h) return Math.hypot(qx, qy - h) - r2;
    return qx * a + qy * b - r1;
  }
  function segD(px, py, ax, ay, bx, by) {
    const dx = bx - ax, dy = by - ay, t = clamp(((px - ax) * dx + (py - ay) * dy) / (dx * dx + dy * dy), 0, 1);
    return [Math.hypot(px - ax - dx * t, py - ay - dy * t), t];
  }

  function renderBG() {
    const w = cBg.width, h = cBg.height, ctx = cBg.getContext("2d", { willReadFrequently: true });
    const img = ctx.createImageData(w, h), D = img.data;
    const { cx, cy, Ro, Rs, Rl, u } = G;
    const sdx = -L2[0], sdy = -L2[1];
    const bAx = cx, bAy = cy, bR1 = Ro * .52, bBx = cx + sdx * Ro * .8, bBy = cy + sdy * Ro * .8, bR2 = Ro * .98;
    const [t0x, t0y] = G.cs0, [t1x, t1y] = G.cs1;
    const cs0x = t0x + sdx * u * .03, cs0y = t0y + sdy * u * .03, cs1x = t1x + sdx * u * .012, cs1y = t1y + sdy * u * .012;
    const zRi = Math.sqrt(Rs * Rs - G.Ri * G.Ri), zl = Math.sqrt(Rs * Rs - Rl * Rl) - zRi, kSh = G.sh * Rl / zl;
    // window reflection frame (perpendicular to light)
    let e1 = [-LV[1], LV[0], 0]; { const l = Math.hypot(e1[0], e1[1]); e1 = [e1[0] / l, e1[1] / l, 0]; }
    const e2 = [LV[1] * e1[2] - LV[2] * e1[1], LV[2] * e1[0] - LV[0] * e1[2], LV[0] * e1[1] - LV[1] * e1[0]];
    // cloth undulation, coarse grid
    const gs = 4, gw = Math.ceil(W / gs) + 2, gh = Math.ceil(H / gs) + 2, WR = new Float32Array(gw * gh);
    for (let j = 0; j < gh; j++) for (let i = 0; i < gw; i++) {
      const X = i * gs, Y = j * gs, f = (x, y) => fbm(x * .0075 / (u / 373), y * .011 / (u / 373), 3);
      const c = f(X, Y), gx = f(X + 2, Y) - c, gy = f(X, Y + 2) - c;
      WR[j * gw + i] = 1 + (gx * L2[0] + gy * L2[1]) * 2.5;
    }
    const tp = 1.75, ca = Math.cos(.36), sa = Math.sin(.36), per = .64 * u, bw = .028 * u;
    const NL = G.NL, ROa = G.RO, RIa = G.RI, roMax = G.roMax;
    const shade = (alb, nx, ny, nz, lit, gloss) => {
      const ndl = Math.max(0, nx * LV[0] + ny * LV[1] + nz * LV[2]);
      const dif = .30 + .95 * ndl * lit;
      const rx = 2 * nz * nx, ry = 2 * nz * ny, rz = 2 * nz * nz - 1;
      const c = rx * LV[0] + ry * LV[1] + rz * LV[2];
      let sp = 0;
      if (c > 0) {
        const a = rx * e1[0] + ry * e1[1], b = rx * e2[0] + ry * e2[1] + rz * e2[2];
        const box = (1 - sstep(.13, .17, Math.abs(a))) * (1 - sstep(.19, .24, Math.abs(b)));
        const bars = Math.max(1 - sstep(.008, .018, Math.abs(a)), 1 - sstep(.008, .018, Math.abs(b - .03)));
        sp = (box * (1 - bars * .85) * .85 + Math.pow(c, 14) * .12) * lit * gloss;
      }
      return [alb[0] * dif + sp, alb[1] * dif + sp * .98, alb[2] * dif + sp * .94];
    };
    for (let y = 0; y < h; y++) {
      const Y = (y + .5) / dpr;
      for (let x = 0; x < w; x++) {
        const X = (x + .5) / dpr, i4 = (y * w + x) * 4;
        // --- linen weave ---
        const yy = Y + (vn(X * .011, Y * .07) - .5) * 1.8, xx = X + (vn(X * .07 + 40, Y * .011) - .5) * 1.8;
        const ri = Math.floor(yy / tp), ci = Math.floor(xx / tp), fy = yy / tp - ri, fxx = xx / tp - ci;
        const over = ((ri + ci) & 1) === 0;
        let tex;
        if (over) tex = (1 + (ih(ri, 7) - .5) * .07 + (vn(X * .022 + ri * 7.3, ri * .37) - .5) * .2) * (.86 + .14 * Math.sqrt(Math.sin(Math.PI * fy)));
        else tex = (1 + (ih(ci, 13) - .5) * .06 + (vn(Y * .02 + ci * 3.1, ci * .41) - .5) * .16) * (.86 + .14 * Math.sqrt(Math.sin(Math.PI * fxx)));
        tex = 1 + (tex - .93) * .2 + (vn(X * .012, Y * .9) - .5) * .018;
        const fl = ih(x * 7 + 3, y * 13 + 1); if (fl > .9993) tex *= .82; else if (fl < .0006) tex *= 1.05;
        // light: window falloff, lattice shadow, undulation
        const gxw = X / gs, gyw = Y / gs, gi = gxw | 0, gj = gyw | 0, gfx = gxw - gi, gfy = gyw - gj, gk = gj * gw + gi;
        const wr = WR[gk] * (1 - gfx) * (1 - gfy) + WR[gk + 1] * gfx * (1 - gfy) + WR[gk + gw] * (1 - gfx) * gfy + WR[gk + gw + 1] * gfx * gfy;
        const uu = X * ca + Y * sa + .1 * u, vv = -X * sa + Y * ca + .22 * u;
        const du = Math.abs(((uu % per) + per) % per - per / 2), dv = Math.abs(((vv % (per * 1.4)) + per * 1.4) % (per * 1.4) - per * .7);
        const lat = 1 - 0 * Math.max(1 - sstep(bw * .5 - 3, bw * .5 + 9, du), 1 - sstep(bw * .4 - 3, bw * .4 + 9, dv));
        const fall = 1.06 - .16 * sstep(-.1, 1.1, (X / W) * .6 + (Y / H) * .4) - .05 * sstep(.6, 1.2, Math.hypot(X / W - .45, Y / H - .5));
        const Lf = fall * lat;
        let r = .92 * tex * Lf * wr, g = .885 * tex * Lf * wr, b = .82 * tex * Lf * wr;
        // --- cast shadows on cloth ---
        const db = sdUCap(X, Y, bAx, bAy, bBx, bBy, bR1, bR2);
        let s = (1 - sstep(-Ro * .2, Ro * .4, db)) * (.62 + .2 * (1 - sstep(Ro * .9, Ro * 1.6, Math.hypot(X - cx, Y - cy))));
        const dxc = X - cx, dyc = Y - cy, rr = Math.hypot(dxc, dyc);
        const side = .35 + .65 * Math.max(0, (dxc * sdx + dyc * sdy) / (rr + 1e-6));
        s += (1 - sstep(0, Ro * .12, rr - Ro)) * .42 * side;
        const [dc, tc] = segD(X, Y, cs0x, cs0y, cs1x, cs1y);
        s += (1 - sstep(-1.5, u * .016 + tc * 0, dc - u * .013)) * .32 * (1 - tc * .3);
        s = clamp(s, 0, .8);
        r *= 1 - s * .56; g *= 1 - s * .53; b *= 1 - s * .45;
        // --- bowl ---
        if (rr < roMax + 2) {
          const th = Math.atan2(dyc, dxc), li = ((th / TAU + 1) % 1) * NL | 0, ro = ROa[li], rI = RIa[li];
          const cov = clamp((ro - rr) * dpr + .5, 0, 1);
          if (cov > 0) {
            // glaze: dark iron body with ash mottling, runs and speckles
            const gm = fbm(X * .05, Y * .05, 3), run = vn(th * 46, rr * .045), rust = sstep(.6, .8, fbm(X * .022 + 50, Y * .022, 3));
            const a = clamp(sstep(.48, .78, gm) * .75 + (run - .5) * .35, 0, 1);
            let alb = [mix(.15, .36, a), mix(.125, .33, a), mix(.105, .30, a)];
            alb = [mix(alb[0], .36, rust * .55), mix(alb[1], .21, rust * .55), mix(alb[2], .12, rust * .55)];
            const scx = Math.floor(X / 2.6), scy = Math.floor(Y / 2.6), sk = ih(scx + 77, scy + 5);
            if (sk > .9 || sk < .04) {
              const ccx = (scx + .2 + .6 * ih(scx, scy + 31)) * 2.6, ccy = (scy + .2 + .6 * ih(scx + 13, scy)) * 2.6, srad = .25 + .55 * ih(scx + 3, scy + 3);
              const sa = 1 - sstep(srad - .4, srad + .4, Math.hypot(X - ccx, Y - ccy));
              const sc = sk > .9 ? [.66, .6, .5] : [.04, .035, .03];
              alb = [mix(alb[0], sc[0], sa), mix(alb[1], sc[1], sa), mix(alb[2], sc[2], sa)];
            }
            let col;
            if (rr < Rl) {
              const q = Math.hypot(dxc / Rl + L2[0] * G.sh, dyc / Rl + L2[1] * G.sh), sh = sstep(G.rimRl - .1, G.rimRl + .14, q);
              const n = fbm(X * .2, Y * .2, 2);
              col = [(.45 + n * .12) * (1 - sh * .55), (.6 + n * .12) * (1 - sh * .5), (.16 + n * .05) * (1 - sh * .4)];
            } else if (rr < rI) {
              let nx = -dxc / Rs, ny = -dyc / Rs, nz = Math.sqrt(Math.max(0, 1 - nx * nx - ny * ny));
              nx += (vn(X * .09, Y * .09) - .5) * .09; ny += (vn(X * .09 + 9, Y * .09) - .5) * .09;
              const nl = Math.hypot(nx, ny, nz); nx /= nl; ny /= nl; nz /= nl;
              const depth = Math.sqrt(Math.max(0, Rs * Rs - rr * rr)) - zRi;
              const qx = dxc + L2[0] * depth * kSh, qy = dyc + L2[1] * depth * kSh;
              const sh = sstep(rI - G.Ri * .035, rI + G.Ri * .035, Math.hypot(qx, qy));
              const tide = 1 - sstep(Rl, Rl + G.Ri * .07, rr);
              alb = [mix(alb[0], .2, tide * .6), mix(alb[1], .27, tide * .6), mix(alb[2], .07, tide * .6)];
              col = shade(alb, nx, ny, nz, (1 - sh * .85) * lat, 1);
              const ao = 1 - .35 * (1 - sstep(Rl, Rl + G.Ri * .05, rr));
              col = [col[0] * ao, col[1] * ao, col[2] * ao];
            } else {
              const t = (rr - rI) / (ro - rI), al = (t * 2 - 1) * 1.25, s1 = Math.sin(al);
              const nx = dxc / rr * s1, ny = dyc / rr * s1, nz = Math.cos(al);
              const thin = (1 - Math.abs(t * 2 - 1)) * (.5 + .5 * vn(th * 30, 3.3));
              alb = [mix(alb[0], .58, thin * .75), mix(alb[1], .42, thin * .75), mix(alb[2], .3, thin * .75)];
              col = shade(alb, nx, ny, nz, lat, .8);
            }
            r = mix(r, col[0], cov); g = mix(g, col[1], cov); b = mix(b, col[2], cov);
          }
        }
        const gr = (ih(x, y) - .5) * .035;
        D[i4] = (r + gr) * 255; D[i4 + 1] = (g + gr) * 255; D[i4 + 2] = (b + gr) * 255; D[i4 + 3] = 255;
      }
    }
    ctx.putImageData(img, 0, 0);
    ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
    drawScoop(ctx);
    drawMound(ctx);
    drawSpecks(ctx);
    ctx.setTransform(1, 0, 0, 1, 0, 0);
  }

  function drawScoop(ctx) {
    const u = G.u, [x0, y0] = G.cs0, [x1, y1] = G.cs1, len = Math.hypot(x1 - x0, y1 - y0), ang = Math.atan2(y1 - y0, x1 - x0);
    const hw = (s) => u * (.0145 + .006 * (1 - sstep(0, .14, s)) + .0016 * Math.exp(-Math.pow((s - .44) / .02, 2)) - .003 * s);
    const bow = (s) => Math.sin(Math.PI * s) * u * .01;
    ctx.save(); ctx.translate(x0, y0); ctx.rotate(ang);
    const path = () => {
      ctx.beginPath();
      for (let k = 0; k <= 60; k++) { const s = k / 60; ctx.lineTo(s * len, bow(s) - hw(s)); }
      for (let k = 60; k >= 0; k--) { const s = k / 60; ctx.lineTo(s * len, bow(s) + hw(s)); }
      ctx.arc(0, 0, hw(0), Math.PI / 2, Math.PI * 1.5); ctx.closePath();
    };
    path();
    const gw = u * .02, gr = ctx.createLinearGradient(0, -gw, 0, gw);
    gr.addColorStop(0, "#7c5a34"); gr.addColorStop(.25, "#b68d5b"); gr.addColorStop(.5, "#9c7445"); gr.addColorStop(1, "#5b3e22");
    ctx.fillStyle = gr; ctx.fill();
    ctx.save(); path(); ctx.clip();
    const rr = rng(5);
    for (let k = 0; k < 46; k++) {
      const off = rr() * 2 - 1, dark = rr() < .55;
      ctx.beginPath();
      for (let j = 0; j <= 40; j++) { const s = j / 40; ctx.lineTo(s * len, bow(s) + off * hw(s)); }
      ctx.strokeStyle = dark ? `rgba(55,32,14,${.12 + rr() * .25})` : `rgba(240,212,160,${.06 + rr() * .16})`;
      ctx.lineWidth = .3 + rr() * .5; ctx.stroke();
    }
    // smoked mottling
    for (let k = 0; k < 9; k++) {
      const s = .15 + rr() * .85, gx = s * len, g2 = ctx.createRadialGradient(gx, 0, 0, gx, 0, u * .05);
      g2.addColorStop(0, "rgba(50,28,12,.35)"); g2.addColorStop(1, "rgba(50,28,12,0)");
      ctx.fillStyle = g2; ctx.fillRect(gx - u * .05, -u * .05, u * .1, u * .1);
    }
    // node (fushi)
    const nx = .44 * len;
    ctx.fillStyle = "rgba(40,22,8,.55)"; ctx.fillRect(nx - .6, -u * .03, 1.4, u * .06);
    ctx.fillStyle = "rgba(255,226,180,.45)"; ctx.fillRect(nx + .9, -u * .03, .9, u * .06);
    // scoop end curls up: lighter and glossy
    const g3 = ctx.createLinearGradient(-hw(0), 0, u * .07, 0);

    const S = G.steamS = G.Ro * 3.1, sr = Math.max(.6, dpr * .55);
    Object.assign(cSteam.style, { left: cx - S / 2 + "px", top: cy - S / 2 + "px", width: S + "px", height: S + "px" });
    cSteam.width = cSteam.height = Math.round(S * sr);
    Object.assign(bowlEl.style, { left: cx - Ri + "px", top: cy - Ri + "px", width: 2 * Ri + "px", height: 2 * Ri + "px" });
    renderBG(); WS = makeWhisk(); CLOUD = CLOUD || makeCloud(); setMask();
    wk.mode = "rest"; wk.x = G.rest.x; wk.y = G.rest.y; wk.ang = G.rest.ang; wk.sx = 1; wk.h = 0; wk.dip = 0;
    puffs.length = grains.length = 0; steamDrawn = false;
    drawTea(); drawSteam(); drawFx();
    hero.classList.add("ready");
    kick();
  }

  const loc = (e) => { const r = hero.getBoundingClientRect(); return { x: (e.clientX - r.left) * (W / r.width), y: (e.clientY - r.top) * (H / r.height) }; };
  let press = null;
  bowlEl.addEventListener("pointerdown", (e) => {
    if (e.button > 0 || !G) return;
    e.preventDefault();
    try { bowlEl.setPointerCapture(e.pointerId); } catch (_) { /* ignore */ }
    const p = loc(e); press = { id: e.pointerId, x: p.x, y: p.y, moved: false, lx: p.x, ly: p.y }; drag.x = p.x; drag.y = p.y;
  });
  bowlEl.addEventListener("pointermove", (e) => {
    if (!press || e.pointerId !== press.id) return;
    const p = loc(e); drag.x = p.x; drag.y = p.y;
    if (!press.moved && Math.hypot(p.x - press.x, p.y - press.y) > 6) {
      press.moved = true; bowlEl.classList.add("drag");
      if (!RM) { wk.mode = "drag"; wk.t = 0; }
    }
    if (press.moved && RM) {
      const [qx, qy] = bowlClamp(p.x, p.y, .85);
      force((qx - G.cx) / G.Rl, (qy - G.cy) / G.Rl, (p.x - press.lx) / G.Rl * 20, (p.y - press.ly) / G.Rl * 20, .22, .5, .02, .1);
    }
    press.lx = p.x; press.ly = p.y;
    kick();
  });
  const endPress = (e, cancel) => {
    if (!press || e.pointerId !== press.id) return;
    if (!press.moved && !cancel) clickBowl(press.x, press.y);
    else if (wk.mode === "drag") { wk.mode = "lift"; wk.t = 0; }
    press = null; bowlEl.classList.remove("drag"); kick();
  };
  bowlEl.addEventListener("pointerup", (e) => endPress(e, false));
  bowlEl.addEventListener("pointercancel", (e) => endPress(e, true));
  hero.addEventListener("click", (e) => {
    if (e.target === bowlEl || !G) return;
    const p = loc(e);
    if (Math.hypot(p.x - G.cx, p.y - G.cy) < G.Ro) clickBowl(p.x, p.y); else puff(p.x, p.y);
    kick();
  });

  setupGL();
  let rt = 0;
  new ResizeObserver(() => { if (!W) resize(); else { clearTimeout(rt); rt = setTimeout(resize, 140); } }).observe(hero);
  new IntersectionObserver((es) => { inView = es[es.length - 1].isIntersecting; kick(); }, { rootMargin: "60px" }).observe(hero);
  document.addEventListener("visibilitychange", kick);
  const onRM = () => { RM = mq.matches; steamDrawn = false; kick(); };
  if (mq.addEventListener) mq.addEventListener("change", onRM); else if (mq.addListener) mq.addListener(onRM);
})();
</script>
</body>
</html>
