<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex">
<title>Galton board</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Public+Sans:wght@400;500&family=Geist+Mono:wght@400&display=swap">
<style>
/* Standalone hero, framed by the home page. Tokens mirror the site so the feathered edge melts into the page. */
:root {
  --bg: #fafafa; --ink: #141414; --ink-2: #6b6b6b; --ink-3: #a3a3a3;
  --ease-out: cubic-bezier(.23, 1, .32, 1);
  --f-sans: "Public Sans", "Helvetica Neue", Arial, sans-serif;
  --f-mono: "Geist Mono", ui-monospace, Menlo, monospace;
  color-scheme: light;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) { --bg: #0f0f0f; --ink: #f2f2f2; --ink-2: #9a9a9a; --ink-3: #5c5c5c; color-scheme: dark; }
}
:root[data-theme="dark"] { --bg: #0f0f0f; --ink: #f2f2f2; --ink-2: #9a9a9a; --ink-3: #5c5c5c; color-scheme: dark; }
* { box-sizing: border-box; }
html, body { margin: 0; height: 100%; overflow: hidden; background: var(--bg); }
body { font-family: var(--f-sans); -webkit-font-smoothing: antialiased; }
#hero { position: relative; width: 100%; height: 100%; }
@media (prefers-reduced-motion: reduce) {
  *, *::before, *::after { animation-duration: 1ms !important; animation-delay: 0ms !important; transition-duration: 1ms !important; }
}

#hero { cursor: pointer; touch-action: pan-y; user-select: none; -webkit-user-select: none; -webkit-tap-highlight-color: transparent; }
#hero .gb-cv { position: absolute; inset: 0; display: block; width: 100%; height: 100%; }
#hero .gb-read, #hero .gb-leg {
  position: absolute; top: 8.6%; z-index: 1; pointer-events: none; white-space: nowrap;
  font: 400 clamp(8px, 1.95vw, 10.5px)/1 var(--f-mono); letter-spacing: .02em; font-variant-numeric: tabular-nums;
  color: rgba(244, 231, 206, .72); text-shadow: 0 1px 1px rgba(0, 0, 0, .45);
}
#hero .gb-read { left: 8.5%; }
#hero .gb-leg { right: 8.5%; display: flex; align-items: center; gap: 6px; }
#hero .gb-leg i { display: block; width: 16px; border-top: 1px dashed currentColor; opacity: .9; }
</style>
</head>
<body>
<div id="hero" role="img" aria-label="Interactive Galton board: steel balls bounce down through a triangle of pins and stack in bins, building a distribution that converges on a dashed binomial prediction. Click or tap to drop a ball; hold to pour.">
    <!-- ===== HERO MARKUP (variant-specific) ===== -->
    <canvas class="gb-cv" aria-hidden="true"></canvas>
    <div class="gb-read" aria-hidden="true">n = 0 · fit —</div>
    <div class="gb-leg" aria-hidden="true"><i></i>predicted</div>
</div>
<script>
// the parent page passes its theme so a forced light/dark choice reaches the frame
try { const t = new URLSearchParams(location.search).get("theme"); if (t === "light" || t === "dark") document.documentElement.dataset.theme = t; } catch (e) {}
</script>
<script>
(() => {
  const hero = document.getElementById("hero");
  const cv = hero.querySelector(".gb-cv");
  const ctx = cv.getContext("2d");
  const readEl = hero.querySelector(".gb-read");
  const mqReduce = matchMedia("(prefers-reduced-motion: reduce)");
  let reduce = mqReduce.matches;

  // ---------- world (logical 600 x 400) ----------
  const W = 600, H = 400, CX = 300, TAU = Math.PI * 2;
  const R = 10, NB = R + 1, DX = 42, DY = 19, PY0 = 66, PR = 3.2, BR = 6;
  const BIN_TOP = PY0 + (R - 1) * DY + 8;
  const FLOOR = 360;
  const BIN_L = CX - NB / 2 * DX, BIN_R = CX + NB / 2 * DX;
  const G = 1500, KX = 100, SUB = 4;
  const HPB = 4; // measured stack height per ball in a bin
  const SIG2 = R / 4;
  // chute ends well above the top pin so a ball's first hop never hits the chute wall
  const FUN_TOP = 12, FUN_W = 92, CH = 10.5, CH_Y0 = 36, CH_Y1 = 43;

  const pk = new Float64Array(NB);
  for (let k = 0, c = 1; k < NB; k++) { pk[k] = c / 2 ** R; c = c * (R - k) / (k + 1); }
  const binom = () => { let k = 0; for (let i = 0; i < R; i++) k += Math.random() < .5 ? 1 : 0; return k; };

  const pins = [];
  for (let i = 0; i < R; i++) for (let j = 0; j <= i; j++) pins.push({ x: CX + (j - i / 2) * DX, y: PY0 + i * DY, row: i, id: pins.length });
  const rowStart = []; for (let i = 0, s = 0; i < R; i++) { rowStart.push(s); s += i + 1; }

  const segs = [];
  const addSeg = (ax, ay, bx, by, r, kind) => segs.push({ ax, ay, bx, by, r, kind, ex: bx - ax, ey: by - ay, l2: (bx - ax) ** 2 + (by - ay) ** 2 });
  for (let k = 0; k <= NB; k++) { const x = BIN_L + k * DX; addSeg(x, BIN_TOP, x, FLOOR + 3, k === 0 || k === NB ? 1.8 : 1.35, "div"); }
  addSeg(CX - FUN_W, FUN_TOP, CX - CH, CH_Y0, 2.2, "fun"); addSeg(CX - CH, CH_Y0, CX - CH, CH_Y1, 2.2, "fun");
  addSeg(CX + FUN_W, FUN_TOP, CX + CH, CH_Y0, 2.2, "fun"); addSeg(CX + CH, CH_Y0, CX + CH, CH_Y1, 2.2, "fun");

  // ---------- state ----------
  let balls = [];
  const hist = new Int32Array(NB);
  let n = 0, bat = 0, nShow = 0, time = 0; // n: lifetime count, bat: balls in the current fill
  let gate = 0, gstate = "idle", gtimer = 0;
  let dripT = .5, lastUser = -99;
  const ripples = [];
  let down = false, ptr = { x: CX, y: 0 }, streamT = 0;
  let par = { x: 0, y: 0 }, parT = { x: 0, y: 0 };

  const fitVal = () => { if (!n) return null; let tv = 0; for (let k = 0; k < NB; k++) tv += Math.abs(hist[k] / n - pk[k]); return 1 - tv / 2; };
  let lastRead = "";
  const updateRead = () => {
    const f = fitVal();
    const s = "n = " + n + " · fit " + (f == null ? "—" : f.toFixed(2));
    if (s !== lastRead) { readEl.textContent = s; lastRead = s; }
  };

  const mkBall = (x, y) => ({ x, y, vx: 0, vy: 0, sleep: false, still: 0, slow: 0, pin: -1, counted: false, born: time, age: 0 });

  function spawnBall(x) {
    let awake = 0; for (const b of balls) if (!b.sleep) awake++;
    if (balls.length > 340 || awake > 70) return;
    x = Math.max(CX - FUN_W + 13, Math.min(CX + FUN_W - 13, x)) + (Math.random() - .5) * 2;
    const ax = Math.abs(x - CX);
    const wy = ax < CH ? CH_Y0 : FUN_TOP + (FUN_W - ax) / (FUN_W - CH) * (CH_Y0 - FUN_TOP);
    balls.push(mkBall(x, wy - BR - 4));
  }

  // ---------- physics ----------
  const GC = 10, GW = Math.ceil(W / GC) + 2, GH = Math.ceil((H + 120) / GC) + 2;
  const head = new Int32Array(GW * GH);
  let next = new Int32Array(512);
  const cell = (x, y) => {
    const cx = Math.max(0, Math.min(GW - 1, ((x / GC) | 0) + 1));
    const cy = Math.max(0, Math.min(GH - 1, (((y + 60) / GC) | 0) + 1));
    return cy * GW + cx;
  };

  function collidePins(b) {
    const ri = Math.round((b.y - PY0) / DY);
    for (let i = Math.max(0, ri - 1); i <= Math.min(R - 1, ri + 1); i++) {
      const jc = Math.round((b.x - CX) / DX + i / 2);
      for (let j = Math.max(0, jc - 1); j <= Math.min(i, jc + 1); j++) {
        const p = pins[rowStart[i] + j];
        const dx = b.x - p.x, dy = b.y - p.y, m = BR + PR, d2 = dx * dx + dy * dy;
        if (d2 >= m * m || d2 < 1e-9) continue;
        const d = Math.sqrt(d2), nx = dx / d, ny = dy / d;
        b.x = p.x + nx * m; b.y = p.y + ny * m;
        const vn = b.vx * nx + b.vy * ny;
        if (vn >= 0) continue;
        if (b.pin !== p.id && ny < 0) {
          // first strike on this pin: a fair coin decides the side
          b.pin = p.id;
          const s = Math.random() < .5 ? -1 : 1;
          b.vy = Math.min(-25, -Math.abs(vn) * (.3 + Math.random() * .12));
          // aim the hop so it lands on top of the pin (or bin) half a step over
          const t = (-b.vy + Math.sqrt(b.vy * b.vy + 2 * G * (p.y + DY - BR - PR - b.y))) / G;
          b.vx = (p.x + s * DX / 2 - b.x) / t * (.95 + Math.random() * .1);
        } else {
          b.vx -= 1.4 * vn * nx; b.vy -= 1.4 * vn * ny;
        }
      }
    }
  }

  function collideSegs(b) {
    for (const s of segs) {
      let t = ((b.x - s.ax) * s.ex + (b.y - s.ay) * s.ey) / s.l2;
      t = t < 0 ? 0 : t > 1 ? 1 : t;
      const px = s.ax + s.ex * t, py = s.ay + s.ey * t;
      const dx = b.x - px, dy = b.y - py, m = BR + s.r, d2 = dx * dx + dy * dy;
      if (d2 >= m * m || d2 < 1e-9) continue;
      const d = Math.sqrt(d2), nx = dx / d, ny = dy / d;
      b.x = px + nx * m; b.y = py + ny * m;
      const vn = b.vx * nx + b.vy * ny;
      if (vn < 0) { b.vx -= 1.3 * vn * nx; b.vy -= 1.3 * vn * ny; }
      if (s.kind === "fun") { b.vx *= .995; }
    }
  }

  function collideFloor(b) {
    if (gate > .35 || b.x < BIN_L || b.x > BIN_R) return;
    if (b.y > FLOOR - BR && b.y < FLOOR + BR) {
      b.y = FLOOR - BR;
      if (b.vy > 0) b.vy *= -.22;
      b.vx *= .9;
    }
  }

  function step(h) {
    for (const b of balls) {
      if (b.sleep) continue;
      b.vy += G * h;
      if (b.y < BIN_TOP) b.vx *= 1 - .6 * h; else b.vx *= 1 - 2.5 * h;
      b.x += b.vx * h; b.y += b.vy * h;
      if (b.y > PY0 - 12 && b.y < BIN_TOP) collidePins(b);
      collideSegs(b); collideFloor(b);
    }
    // ball-ball
    if (next.length < balls.length) next = new Int32Array(balls.length * 2);
    head.fill(-1);
    for (let i = 0; i < balls.length; i++) { const c = cell(balls[i].x, balls[i].y); next[i] = head[c]; head[c] = i; }
    for (let it = 0; it < 2; it++) {
      for (let i = 0; i < balls.length; i++) {
        const a = balls[i]; if (a.sleep) continue;
        const c0 = cell(a.x, a.y);
        for (let oy = -1; oy <= 1; oy++) for (let ox = -1; ox <= 1; ox++) {
          for (let j = head[c0 + oy * GW + ox] ?? -1; j !== -1 && j !== undefined; j = next[j]) {
            if (j === i) continue;
            const b = balls[j];
            if (!b.sleep && j < i) continue;
            const dx = a.x - b.x, dy = a.y - b.y, d2 = dx * dx + dy * dy, m = 2 * BR;
            if (d2 >= m * m || d2 < 1e-9) continue;
            const d = Math.sqrt(d2), nx = dx / d, ny = dy / d, ov = m - d;
            const rv = (a.vx - b.vx) * nx + (a.vy - b.vy) * ny;
            if (b.sleep) {
              a.x += nx * ov; a.y += ny * ov;
              if (rv < 0) { a.vx -= 1.15 * rv * nx; a.vy -= 1.15 * rv * ny; }
            } else {
              a.x += nx * ov / 2; a.y += ny * ov / 2; b.x -= nx * ov / 2; b.y -= ny * ov / 2;
              if (rv < 0) { const j2 = -1.15 * rv / 2; a.vx += j2 * nx; a.vy += j2 * ny; b.vx -= j2 * nx; b.vy -= j2 * ny; }
            }
          }
        }
      }
    }
    for (const b of balls) if (!b.sleep) { collideSegs(b); collideFloor(b); }
  }

  function post(dt) {
    let full = false;
    for (const b of balls) {
      b.age += dt;
      if (b.sleep) continue;
      if (!b.counted && b.y > BIN_TOP + BR && b.x > BIN_L && b.x < BIN_R) {
        b.counted = true;
        if (gate === 0) { hist[Math.min(NB - 1, Math.max(0, Math.floor((b.x - BIN_L) / DX)))]++; n++; bat++; }
      }
      const sp2 = b.vx * b.vx + b.vy * b.vy;
      // safety net: a ball resting in the pin field (balanced on a pin or wedged by others) gets a fresh coin-flip hop
      if (b.y > PY0 - 14 && b.y < BIN_TOP && sp2 < 35 * 35) {
        b.slow += dt;
        if (b.slow > .2) { b.slow = 0; b.pin = -1; b.vx = (Math.random() < .5 ? -1 : 1) * (70 + Math.random() * 30); b.vy = -55; }
      } else b.slow = 0;
      if (gate === 0 && b.y > BIN_TOP && sp2 < 22 * 22) {
        b.still += dt;
        if (b.still > .3) { b.sleep = true; b.vx = b.vy = 0; if (b.y - BR < BIN_TOP + 4) full = true; }
      } else b.still = 0;
    }
    balls = balls.filter(b => b.y < H + 40 && b.age < 20 || (b.sleep && b.y < H));
    if (full && gstate === "idle") { gstate = "full"; gtimer = reduce ? 0 : 1.1; }
    if (gstate === "full") {
      gtimer -= dt;
      if (gtimer <= 0) {
        gstate = "opening"; bat = 0;
        for (const b of balls) { b.sleep = false; b.still = 0; b.vy = Math.random() * 10; }
      }
    } else if (gstate === "opening") {
      gate = Math.min(1, gate + dt / .4);
      if (gate >= 1) { gstate = "draining"; gtimer = 1.4; }
    } else if (gstate === "draining") {
      gtimer -= dt;
      if (gtimer <= 0 && !balls.some(b => b.y > BIN_TOP - 20 && b.y < FLOOR + 8)) gstate = "closing";
    } else if (gstate === "closing") {
      gate = Math.max(0, gate - dt / .45);
      if (gate <= 0) gstate = "idle";
    }
    updateRead();
  }

  function update(dt) {
    time += dt;
    const h = dt / SUB;
    for (let i = 0; i < SUB; i++) step(h);
    post(dt);
  }

  function settle(maxSec) { for (let t = 0; t < maxSec; t += 1 / 60) { update(1 / 60); if (!balls.some(b => !b.sleep)) break; } }

  function seed(count) {
    const per = new Int32Array(NB);
    for (let i = 0; i < count; i++) {
      const k = binom(), idx = per[k]++;
      const cx = BIN_L + (k + .5) * DX;
      const b = mkBall(cx + [-13, 0, 13][idx % 3] + (Math.random() - .5) * 2, FLOOR - BR - 1 - Math.floor(idx / 3) * 12.5);
      b.counted = true; b.born = -9; hist[k]++; n++; bat++;
      balls.push(b);
    }
    settle(4);
  }

  // instant drop for reduced motion: the ball appears already settled in its bin
  function instantDrop() {
    if (gstate !== "idle") { balls = []; bat = 0; gstate = "idle"; gate = 0; }
    const k = binom();
    const b = mkBall(BIN_L + (k + .5) * DX + (Math.random() - .5) * 14, BIN_TOP - 4);
    b.born = -9; balls.push(b);
    settle(3);
    if (gstate !== "idle") { balls = []; bat = 0; gstate = "idle"; gate = 0; }
  }

  // ---------- procedural textures ----------
  const perm = new Uint8Array(512);
  { let s = 1337; const p = [...Array(256).keys()]; for (let i = 255; i > 0; i--) { s = (s * 16807) % 2147483647; const j = s % (i + 1); [p[i], p[j]] = [p[j], p[i]]; } for (let i = 0; i < 512; i++) perm[i] = p[i & 255]; }
  const hsh = (x, y) => perm[perm[x & 255] + (y & 255)] / 255;
  function vn(x, y) {
    const ix = Math.floor(x), iy = Math.floor(y), fx = x - ix, fy = y - iy;
    const ux = fx * fx * (3 - 2 * fx), uy = fy * fy * (3 - 2 * fy);
    const a = hsh(ix, iy), b = hsh(ix + 1, iy), c = hsh(ix, iy + 1), d = hsh(ix + 1, iy + 1);
    return a + (b - a) * ux + (c - a) * uy + (a - b - c + d) * ux * uy;
  }
  const mkCanvas = (w, h) => { const c = document.createElement("canvas"); c.width = w; c.height = h; return c; };

  let woodCv = null, maskCv = null;
  function makeWood() {
    const w = 1200, h = 800, c = mkCanvas(w, h), g = c.getContext("2d");
    const img = g.createImageData(w, h), d = img.data;
    const k = W / w;
    for (let y = 0; y < h; y++) {
      const v = y * k;
      for (let x = 0; x < w; x++) {
        const u = x * k;
        const warp = vn(u * .008, v * .0022) * 1.6 + vn(u * .021 + 5, v * .006) * .6;
        const t = u * .3 + warp * 13;
        const s = .5 + .5 * Math.sin(t);
        const late = s * s * s * s * s * s;
        const fib = vn(u * 1.7, v * .022), fine = vn(u * 4.1 + 11, v * .07);
        const broad = vn(u * .0045 + 40, v * .0038);
        const pore = vn(u * 6 + 3, v * .5);
        let L = .5 - .26 * late + .1 * s + .22 * (fib - .5) + .1 * (fine - .5) + .26 * (broad - .5);
        if (pore > .8) L -= (pore - .8) * 1.4;
        L = L < 0 ? 0 : L > 1 ? 1 : L;
        const i = (y * w + x) * 4;
        d[i] = 38 + 122 * L; d[i + 1] = 24 + 84 * L; d[i + 2] = 15 + 54 * L; d[i + 3] = 255;
      }
    }
    g.putImageData(img, 0, 0);
    return c;
  }

  function makeMask() {
    const w = 900, h = 600, c = mkCanvas(w, h), g = c.getContext("2d");
    const img = g.createImageData(w, h), d = img.data;
    const ins = 8, rad = 64, F = 46;
    const hw = w / 2 - ins, hh = h / 2 - ins;
    for (let y = 0; y < h; y++) for (let x = 0; x < w; x++) {
      const qx = Math.abs(x - w / 2) - (hw - rad), qy = Math.abs(y - h / 2) - (hh - rad);
      const sd = Math.hypot(Math.max(qx, 0), Math.max(qy, 0)) + Math.min(Math.max(qx, qy), 0) - rad;
      const wob = (vn(x * .018, y * .018) - .5) * 9 + (vn(x * .07 + 9, y * .07) - .5) * 3;
      let a = (-sd - wob) / F; a = a < 0 ? 0 : a > 1 ? 1 : a;
      a = a * a * (3 - 2 * a);
      a += (Math.random() - .5) * .2 * a * (1 - a) * 4;
      const i = (y * w + x) * 4;
      d[i] = d[i + 1] = d[i + 2] = 0; d[i + 3] = Math.max(0, Math.min(255, a * 255));
    }
    g.putImageData(img, 0, 0);
    return c;
  }

  let S = 1, baseCv = null, overCv = null, ballSpr = null, shSpr = null, pinShSpr = null;
  const BALL_PAD = 1, SH_R = 9.5;

  function makeBallSprite() {
    const ws = 2 * (BR + BALL_PAD), px = Math.ceil(ws * S), c = mkCanvas(px, px), g = c.getContext("2d");
    const k = px / ws; g.scale(k, k);
    const o = BR + BALL_PAD, r = BR;
    g.save(); g.beginPath(); g.arc(o, o, r, 0, TAU); g.clip();
    // environment reflection: bright room above, warm walnut below
    const env = g.createLinearGradient(0, o - r, 0, o + r);
    env.addColorStop(0, "#fbfaf6"); env.addColorStop(.3, "#d6d4cf"); env.addColorStop(.47, "#8f8a83");
    env.addColorStop(.53, "#3c2c20"); env.addColorStop(.75, "#2a1d14"); env.addColorStop(1, "#5a3e28");
    g.fillStyle = env; g.fillRect(0, 0, ws, ws);
    // horizon curvature
    g.fillStyle = "rgba(20,14,10,.35)";
    g.beginPath(); g.ellipse(o, o + r * .95, r * 1.25, r * .82, 0, Math.PI, TAU); g.fill();
    // fresnel edge
    const fr = g.createRadialGradient(o, o, r * .45, o, o, r);
    fr.addColorStop(0, "rgba(0,0,0,0)"); fr.addColorStop(.8, "rgba(0,0,0,.18)"); fr.addColorStop(1, "rgba(0,0,0,.6)");
    g.fillStyle = fr; g.fillRect(0, 0, ws, ws);
    // warm bounce on the lower rim
    const bo = g.createRadialGradient(o + r * .2, o + r * .95, 0, o + r * .2, o + r * .95, r * .8);
    bo.addColorStop(0, "rgba(214,160,104,.55)"); bo.addColorStop(1, "rgba(214,160,104,0)");
    g.fillStyle = bo; g.fillRect(0, 0, ws, ws);
    // specular
    const sp = g.createRadialGradient(o - r * .38, o - r * .42, 0, o - r * .38, o - r * .42, r * .42);
    sp.addColorStop(0, "rgba(255,255,255,1)"); sp.addColorStop(.35, "rgba(255,255,255,.75)"); sp.addColorStop(1, "rgba(255,255,255,0)");
    g.fillStyle = sp; g.fillRect(0, 0, ws, ws);
    g.restore();
    g.beginPath(); g.arc(o, o, r - .15, 0, TAU); g.lineWidth = .3; g.strokeStyle = "rgba(0,0,0,.45)"; g.stroke();
    return c;
  }

  function makeShadow(rw, alpha) {
    const ws = 2 * rw, px = Math.ceil(ws * S), c = mkCanvas(px, px), g = c.getContext("2d");
    const k = px / ws; g.scale(k, k);
    const gr = g.createRadialGradient(rw, rw, 0, rw, rw, rw);
    gr.addColorStop(0, `rgba(8,4,2,${alpha})`); gr.addColorStop(.45, `rgba(8,4,2,${alpha * .7})`); gr.addColorStop(1, "rgba(8,4,2,0)");
    g.fillStyle = gr; g.fillRect(0, 0, ws, ws);
    return c;
  }

  function buildLayers() {
    ballSpr = makeBallSprite(); shSpr = makeShadow(SH_R, .62); pinShSpr = makeShadow(5.4, .62);
    // base: wood, light, pins, dividers, hopper
    baseCv = mkCanvas(cv.width, cv.height);
    let g = baseCv.getContext("2d"); g.setTransform(S, 0, 0, S, 0, 0);
    g.drawImage(woodCv, 0, 0, W, H);
    let gr = g.createRadialGradient(160, 40, 0, 160, 40, 560);
    gr.addColorStop(0, "rgba(255,222,180,.26)"); gr.addColorStop(.45, "rgba(255,210,160,.08)"); gr.addColorStop(1, "rgba(255,210,160,0)");
    g.fillStyle = gr; g.fillRect(0, 0, W, H);
    gr = g.createRadialGradient(470, 390, 0, 470, 390, 360);
    gr.addColorStop(0, "rgba(0,0,0,.34)"); gr.addColorStop(1, "rgba(0,0,0,0)");
    g.fillStyle = gr; g.fillRect(0, 0, W, H);
    // recess behind bins
    gr = g.createLinearGradient(0, BIN_TOP - 10, 0, FLOOR);
    gr.addColorStop(0, "rgba(0,0,0,0)"); gr.addColorStop(1, "rgba(0,0,0,.22)");
    g.fillStyle = gr; g.fillRect(BIN_L, BIN_TOP - 10, BIN_R - BIN_L, FLOOR - BIN_TOP + 10);

    // pins
    for (const p of pins) g.drawImage(pinShSpr, p.x + 1.5 - 5.4, p.y + 2.2 - 5.4, 10.8, 10.8);
    for (const p of pins) {
      const pg = g.createRadialGradient(p.x - .95, p.y - 1.05, .1, p.x, p.y, PR);
      pg.addColorStop(0, "#ffffff"); pg.addColorStop(.28, "#d8d6d1"); pg.addColorStop(.7, "#86837d"); pg.addColorStop(1, "#3a3732");
      g.fillStyle = pg; g.beginPath(); g.arc(p.x, p.y, PR, 0, TAU); g.fill();
      g.lineWidth = .3; g.strokeStyle = "rgba(0,0,0,.4)"; g.stroke();
      g.fillStyle = "rgba(255,236,210,.28)"; g.beginPath(); g.arc(p.x + .9, p.y + 1.2, .7, 0, TAU); g.fill();
    }

    // brass dividers
    g.save();
    g.shadowColor = "rgba(6,3,1,.55)"; g.shadowBlur = 2.6 * S; g.shadowOffsetX = 1.5 * S; g.shadowOffsetY = 1.1 * S;
    for (const s of segs) {
      if (s.kind !== "div") continue;
      const hw = s.r;
      const bg = g.createLinearGradient(s.ax - hw, 0, s.ax + hw, 0);
      bg.addColorStop(0, "#3d2d16"); bg.addColorStop(.3, "#d9c08a"); bg.addColorStop(.55, "#8e7140"); bg.addColorStop(1, "#2e2210");
      g.fillStyle = bg;
      g.beginPath(); g.moveTo(s.ax - hw, s.by); g.lineTo(s.ax - hw, s.ay); g.arc(s.ax, s.ay, hw, Math.PI, 0); g.lineTo(s.ax + hw, s.by); g.closePath(); g.fill();
    }
    // hopper
    g.lineCap = "round";
    for (const s of segs) {
      if (s.kind !== "fun") continue;
      g.lineWidth = s.r * 2; g.strokeStyle = "#7d7a74";
      g.beginPath(); g.moveTo(s.ax, s.ay); g.lineTo(s.bx, s.by); g.stroke();
    }
    g.restore();
    // brushed-steel faces: gradient across each plate
    for (const s of segs) {
      if (s.kind !== "fun") continue;
      const l = Math.sqrt(s.l2), nx = -s.ey / l, ny = s.ex / l, r = s.r;
      const sg = g.createLinearGradient(s.ax - nx * r, s.ay - ny * r, s.ax + nx * r, s.ay + ny * r);
      const up = ny < 0 || (ny === 0 && nx < 0);
      const st = up ? ["#2c2a27", "#6f6c66", "#c9c6bf", "#f7f5f0"] : ["#f7f5f0", "#c9c6bf", "#6f6c66", "#2c2a27"];
      sg.addColorStop(0, st[0]); sg.addColorStop(.35, st[1]); sg.addColorStop(.7, st[2]); sg.addColorStop(1, st[3]);
      g.strokeStyle = sg; g.lineWidth = r * 2; g.lineCap = "round";
      g.beginPath(); g.moveTo(s.ax, s.ay); g.lineTo(s.bx, s.by); g.stroke();
    }
    for (const sx of [-1, 1]) {
      const x = CX + sx * (FUN_W - 1), y = FUN_TOP;
      const sg = g.createRadialGradient(x - .6, y - .7, .1, x, y, 2.4);
      sg.addColorStop(0, "#fffef8"); sg.addColorStop(.5, "#a19e97"); sg.addColorStop(1, "#3a3833");
      g.fillStyle = sg; g.beginPath(); g.arc(x, y, 2.4, 0, TAU); g.fill();
      g.strokeStyle = "rgba(30,28,25,.7)"; g.lineWidth = .45;
      g.beginPath(); g.moveTo(x - 1.5, y + .6); g.lineTo(x + 1.5, y - .6); g.stroke();
    }
    // divider caps catch the light
    for (const s of segs) {
      if (s.kind !== "div") continue;
      g.fillStyle = "rgba(255,240,200,.75)"; g.beginPath(); g.arc(s.ax - .35, s.ay - .2, s.r * .55, 0, TAU); g.fill();
    }

    // overlay: vignette, dust, grain
    overCv = mkCanvas(cv.width, cv.height);
    g = overCv.getContext("2d"); g.setTransform(S, 0, 0, S, 0, 0);
    gr = g.createRadialGradient(W / 2, H * .46, H * .25, W / 2, H / 2, W * .62);
    gr.addColorStop(0, "rgba(10,6,3,0)"); gr.addColorStop(1, "rgba(10,6,3,.5)");
    g.fillStyle = gr; g.fillRect(0, 0, W, H);
    for (let i = 0; i < 3; i++) {
      const x = 80 + Math.random() * 440, y = 60 + Math.random() * 280, r = 30 + Math.random() * 50;
      gr = g.createRadialGradient(x, y, 0, x, y, r);
      gr.addColorStop(0, "rgba(255,250,240,.028)"); gr.addColorStop(1, "rgba(255,250,240,0)");
      g.fillStyle = gr; g.fillRect(x - r, y - r, 2 * r, 2 * r);
    }
    for (let i = 0; i < 70; i++) {
      g.fillStyle = `rgba(255,248,236,${.05 + Math.random() * .18})`;
      g.beginPath(); g.arc(Math.random() * W, Math.random() * H, .2 + Math.random() * .55, 0, TAU); g.fill();
    }
    g.setTransform(1, 0, 0, 1, 0, 0);
    const tile = mkCanvas(160, 160), tg = tile.getContext("2d"), ti = tg.createImageData(160, 160);
    for (let i = 0; i < ti.data.length; i += 4) {
      const v = Math.random() < .5 ? 0 : 255;
      ti.data[i] = ti.data[i + 1] = ti.data[i + 2] = v; ti.data[i + 3] = Math.random() * 26;
    }
    tg.putImageData(ti, 0, 0);
    const gs = Math.max(1, cv.width / (hero.clientWidth || W) * .9);
    g.scale(gs, gs); g.fillStyle = g.createPattern(tile, "repeat"); g.fillRect(0, 0, cv.width / gs, cv.height / gs);
  }

  // ---------- render ----------
  function render() {
    if (!baseCv) return;
    ctx.setTransform(1, 0, 0, 1, 0, 0);
    ctx.drawImage(baseCv, 0, 0);
    ctx.setTransform(S, 0, 0, S, 0, 0);

    // gate (floor plank)
    if (gate < 1) {
      ctx.save();
      ctx.globalAlpha = 1 - gate;
      const fy = FLOOR + gate * 12;
      ctx.fillStyle = "rgba(6,3,1,.45)"; ctx.fillRect(BIN_L - 1, fy + 1.4, BIN_R - BIN_L + 4, 4.6);
      const fg = ctx.createLinearGradient(0, fy, 0, fy + 4.4);
      fg.addColorStop(0, "#f3dea4"); fg.addColorStop(.3, "#b8954a"); fg.addColorStop(1, "#3e2c12");
      ctx.fillStyle = fg; ctx.fillRect(BIN_L - 1.5, fy, BIN_R - BIN_L + 3, 4.4);
      ctx.restore();
    }

    // shadows then balls
    for (const b of balls) ctx.drawImage(shSpr, b.x + 1.9 - SH_R, b.y + 2.7 - SH_R, 2 * SH_R, 2 * SH_R);
    const bs = BR + BALL_PAD;
    for (const b of balls) {
      const k = Math.min(1, (time - b.born) / .18), e = 1 - (1 - k) * (1 - k);
      if (e < 1) { ctx.globalAlpha = e; ctx.drawImage(ballSpr, b.x - bs * e, b.y - bs * e, 2 * bs * e, 2 * bs * e); ctx.globalAlpha = 1; }
      else ctx.drawImage(ballSpr, b.x - bs, b.y - bs, 2 * bs, 2 * bs);
    }

    // predicted distribution: expected stack height for the current n
    if (nShow > .3) {
      ctx.save();
      ctx.beginPath();
      const norm = 1 / Math.sqrt(TAU * SIG2);
      for (let x = BIN_L + 2; x <= BIN_R - 2; x += 2) {
        const z = (x - CX) / DX, h = nShow * norm * Math.exp(-z * z / (2 * SIG2)) * HPB;
        const y = Math.max(BIN_TOP - 24, FLOOR - h);
        x === BIN_L + 2 ? ctx.moveTo(x, y) : ctx.lineTo(x, y);
      }
      ctx.lineJoin = "round"; ctx.lineCap = "round";
      ctx.setLineDash([]); ctx.lineWidth = 3; ctx.strokeStyle = "rgba(10,6,3,.22)"; ctx.stroke();
      ctx.setLineDash([2.6, 3.4]); ctx.lineDashOffset = -time * 3;
      ctx.lineWidth = 1.2; ctx.strokeStyle = "rgba(252,238,208,.92)"; ctx.stroke();
      ctx.restore();
    }

    // taps on the glass
    for (let i = ripples.length - 1; i >= 0; i--) {
      const r = ripples[i], k = (time - r.t) / .6;
      if (k >= 1) { ripples.splice(i, 1); continue; }
      const e = 1 - Math.pow(1 - k, 3);
      ctx.beginPath(); ctx.arc(r.x, r.y, 3 + 24 * e, 0, TAU);
      ctx.lineWidth = 1.1 * (1 - k); ctx.strokeStyle = `rgba(255,250,240,${.4 * (1 - k)})`; ctx.stroke();
    }

    // glass reflection (drifts slowly, parallax with pointer)
    const gx = W * .64 + Math.sin(time * .07) * 26 + par.x * 14, gy = par.y * 6;
    ctx.save(); ctx.translate(gx, gy); ctx.rotate(.42);
    let gg = ctx.createLinearGradient(-70, 0, 70, 0);
    gg.addColorStop(0, "rgba(255,255,255,0)"); gg.addColorStop(.38, "rgba(255,255,255,.065)"); gg.addColorStop(.5, "rgba(255,255,255,.11)");
    gg.addColorStop(.62, "rgba(255,255,255,.065)"); gg.addColorStop(1, "rgba(255,255,255,0)");
    ctx.fillStyle = gg; ctx.fillRect(-70, -300, 140, 900);
    gg = ctx.createLinearGradient(86, 0, 104, 0);
    gg.addColorStop(0, "rgba(255,255,255,0)"); gg.addColorStop(.5, "rgba(255,255,255,.08)"); gg.addColorStop(1, "rgba(255,255,255,0)");
    ctx.fillStyle = gg; ctx.fillRect(86, -300, 18, 900);
    ctx.restore();

    ctx.setTransform(1, 0, 0, 1, 0, 0);
    ctx.drawImage(overCv, 0, 0);
    // feathered edge: cut alpha so the scene dissolves into whatever --bg is
    ctx.globalCompositeOperation = "destination-in";
    ctx.drawImage(maskCv, 0, 0, cv.width, cv.height);
    ctx.globalCompositeOperation = "source-over";
  }

  // ---------- loop ----------
  let running = false, inView = true, last = 0;
  function frame(now) {
    if (!running) return;
    const dt = Math.min(1 / 30, Math.max(0, (now - last) / 1000)); last = now;
    if (down) { streamT -= dt; if (streamT <= 0) { spawnBall(ptr.x); streamT = .09; } }
    if (gstate === "idle" && time - lastUser > 2.5) { dripT -= dt; if (dripT <= 0) { spawnBall(CX + (Math.random() - .5) * 90); dripT = .8 + Math.random() * .9; } }
    update(dt);
    nShow += (bat - nShow) * (1 - Math.exp(-dt * 5));
    par.x += (parT.x - par.x) * (1 - Math.exp(-dt * 3)); par.y += (parT.y - par.y) * (1 - Math.exp(-dt * 3));
    render();
    requestAnimationFrame(frame);
  }
  function setRunning() {
    const should = inView && !document.hidden && !reduce;
    if (should && !running) { running = true; last = performance.now(); requestAnimationFrame(frame); }
    else if (!should) running = false;
  }

  function resize() {
    const r = hero.getBoundingClientRect();
    if (!r.width) return;
    const dpr = Math.min(2, window.devicePixelRatio || 1);
    const w = Math.round(r.width * dpr), h = Math.round(r.height * dpr);
    if (w === cv.width && h === cv.height && baseCv) return;
    cv.width = w; cv.height = h; S = w / W;
    buildLayers();
    if (!running) { nShow = bat; render(); }
  }

  // ---------- input ----------
  const toWorld = e => { const r = cv.getBoundingClientRect(); return { x: (e.clientX - r.left) / r.width * W, y: (e.clientY - r.top) / r.height * H }; };
  hero.addEventListener("pointerdown", e => {
    if (e.button > 0) return;
    const p = toWorld(e); ptr = p; lastUser = time;
    if (reduce) { instantDrop(); nShow = bat; render(); return; }
    down = true; streamT = .22;
    try { hero.setPointerCapture(e.pointerId); } catch (_) {}
    ripples.push({ x: p.x, y: p.y, t: time });
    spawnBall(p.x);
  });
  hero.addEventListener("pointermove", e => {
    const p = toWorld(e);
    parT.x = Math.max(-1, Math.min(1, (p.x - W / 2) / (W / 2)));
    parT.y = Math.max(-1, Math.min(1, (p.y - H / 2) / (H / 2)));
    if (down) { ptr = p; lastUser = time; }
  });
  const up = () => { down = false; };
  hero.addEventListener("pointerup", up);
  hero.addEventListener("pointercancel", up);
  hero.addEventListener("lostpointercapture", up);
  hero.addEventListener("pointerleave", () => { parT.x = parT.y = 0; });

  // ---------- boot ----------
  woodCv = makeWood();
  maskCv = makeMask();
  seed(64);
  time = 0; for (const b of balls) b.born = -9;
  nShow = bat; updateRead();
  resize();
  new ResizeObserver(resize).observe(hero);
  window.addEventListener("resize", resize);
  new IntersectionObserver(es => { inView = es[es.length - 1].isIntersecting; setRunning(); }).observe(hero);
  document.addEventListener("visibilitychange", setRunning);
  const onReduce = () => { reduce = mqReduce.matches; setRunning(); if (reduce) { nShow = bat; render(); } };
  mqReduce.addEventListener ? mqReduce.addEventListener("change", onReduce) : mqReduce.addListener(onReduce);
  setRunning();
})();
</script>
</body>
</html>
